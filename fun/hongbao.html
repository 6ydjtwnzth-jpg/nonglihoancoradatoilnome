<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitten Red Envelope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --night-1: #1b0e2c;
    --night-2: #3f1636;
    --night-3: #7a2440;
    --red: #dc3b40;
    --red-deep: #b0272f;
    --red-dark: #7c1820;
    --gold: #f4c25b;
    --gold-deep: #c98d2a;
    --gold-soft: #ffe6a8;
    --paper: #fff8ec;
    --ink: #4a2a28;
    --ink-soft: #86625c;
    --pink: #ff9fb4;
    --cat: #fffaf4;
    --cat-line: #4a2a28;
    --cat-orange: #f5a55a;
    --hand: 'Gaegu', 'ZCOOL KuaiLe', cursive;
    --brush: 'Ma Shan Zheng', 'ZCOOL KuaiLe', serif;
    --cute: 'ZCOOL KuaiLe', 'Gaegu', cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(70% 45% at 80% 8%, rgba(255, 214, 150, .18), transparent 70%),
      linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
    color: var(--ink);
    font-family: var(--hand);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #sky { z-index: 0; }
  #fx { z-index: 4; } /* hearts float behind the scroll so the text stays readable */

  /* ---------- sky decor ---------- */
  .moon {
    position: fixed; top: 7%; right: 9%; width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fffbe8 0%, #ffeaa8 55%, #f7cf78 100%);
    box-shadow: 0 0 40px 10px rgba(255, 226, 150, .35), 0 0 120px 40px rgba(255, 200, 120, .15);
    z-index: 1;
  }
  .branch { position: fixed; top: -10px; left: -14px; width: 190px; z-index: 1; opacity: .95; }
  .sky-lantern {
    position: fixed; bottom: -60px; z-index: 1;
    width: 22px; height: 28px;
    border-radius: 45% 45% 22% 22%;
    background: linear-gradient(180deg, #ffb35c, #e2513c);
    box-shadow: 0 0 18px 6px rgba(255, 150, 70, .35);
    opacity: .85;
    animation: rise linear infinite;
  }
  .sky-lantern::after {
    content: ''; position: absolute; left: 50%; bottom: 3px; width: 6px; height: 6px; margin-left: -3px;
    border-radius: 50%; background: #fff3c4; box-shadow: 0 0 8px 3px #ffd27a;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) scale(var(--s, 1)); opacity: 0; }
    8%   { opacity: .85; }
    50%  { transform: translate(var(--sway, 20px), -55vh) scale(var(--s, 1)); }
    92%  { opacity: .7; }
    100% { transform: translate(0, -115vh) scale(calc(var(--s, 1) * .7)); opacity: 0; }
  }

  /* ---------- scene (natural size 380x700, scaled to fit) ---------- */
  .scene {
    position: fixed; left: 50%; top: 50%;
    width: 380px; height: 700px;
    transform: translate(-50%, -50%) scale(var(--fit, 1));
    z-index: 5;
  }

  /* message scroll */
  .note {
    position: absolute; left: 14px; right: 14px; bottom: 474px;
    padding: 22px 22px 16px;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .6);
    text-align: center;
    opacity: 0; transform: translateY(16px) scale(.96);
    transition: opacity .5s ease, transform .6s cubic-bezier(.2, 1.4, .4, 1);
    pointer-events: none;
  }
  .note::before, .note::after {
    content: ''; position: absolute; left: -10px; right: -10px; height: 12px; border-radius: 6px;
    background: linear-gradient(180deg, #9a3a2a, #6e2219);
    box-shadow: inset 0 0 0 2px rgba(244, 194, 91, .35);
  }
  .note::before { top: -7px; }
  .note::after { bottom: -7px; }
  .show-note .note { opacity: 1; transform: none; pointer-events: auto; }
  .zh { margin: 0; font: 31px/1.38 var(--brush); color: var(--ink); letter-spacing: 1px; min-height: 43px; }
  .zh .ch { display: inline-block; opacity: 0; animation: ink .45s ease forwards; }
  @keyframes ink { from { opacity: 0; transform: translateY(5px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
  .en { margin: 8px 0 0; font: 700 21px/1.15 var(--hand); color: var(--ink-soft); opacity: 0; transition: opacity .6s ease; }
  .src { margin: 6px 0 0; font: 15px/1.2 var(--hand); color: var(--red-deep); opacity: 0; transition: opacity .6s ease .15s; }
  .done .en, .done .src { opacity: 1; }
  .instant .ch { animation-duration: .01s !important; animation-delay: 0s !important; }
  .stamp {
    position: absolute; right: 10px; bottom: 10px; width: 30px; height: 30px; border-radius: 6px;
    background: var(--red); color: #fff3df; font: 20px/30px var(--cute); transform: rotate(8deg);
    opacity: .9;
  }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #ead7c8; transition: background .3s, transform .3s; }
  .dots i.on { background: var(--gold-deep); transform: scale(1.35); }
  .again {
    display: none; margin: 10px auto 0; min-height: 44px; padding: 6px 20px 4px;
    border: 2px solid var(--gold); border-radius: 999px; background: var(--red); color: #fff3df;
    font: 700 22px/1 var(--hand); cursor: pointer;
  }
  .the-end .again { display: block; }

  /* ---------- red envelope ---------- */
  .hb { position: absolute; left: 85px; top: 350px; width: 210px; height: 290px; perspective: 900px; }
  .hb.closed { animation: wiggle 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes wiggle {
    0%, 70%, 100% { transform: rotate(0); }
    74% { transform: rotate(-3deg) translateY(-2px); }
    78% { transform: rotate(3deg); }
    82% { transform: rotate(-2deg); }
    86% { transform: rotate(1deg); }
  }
  .hb-back {
    position: absolute; inset: 0; border-radius: 14px; z-index: 1;
    background: linear-gradient(180deg, var(--red-dark), #9c2028 40%, var(--red-deep));
    box-shadow: 0 24px 40px -18px rgba(0, 0, 0, .7);
  }
  .tail {
    position: absolute; left: 172px; top: 150px; width: 74px; height: 92px; z-index: 2;
    transform-origin: 10% 90%;
    animation: swish 2.4s ease-in-out infinite;
    transition: opacity .3s ease;
  }
  @keyframes swish { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
  .hb.open .tail { opacity: 0; }

  .kitty {
    position: absolute; left: 5px; top: 34px; width: 200px; height: 210px; z-index: 3;
    transition: transform .55s cubic-bezier(.45, 0, .55, 1);
  }
  .hb.open .kitty { transform: translateY(-152px); transition: transform .9s cubic-bezier(.25, 1.55, .45, 1) .3s; }
  .kitty svg { width: 100%; height: 100%; overflow: visible; }
  .kitty .body-bob { transform-origin: 100px 200px; }
  .hb.open .kitty .body-bob { animation: breathe 3s ease-in-out infinite 1.4s; }
  @keyframes breathe { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg) translateY(-2px); } }
  .kitty.hop .body-bob { animation: hop .6s cubic-bezier(.3, 1.5, .5, 1) !important; }
  @keyframes hop {
    0% { transform: scale(1, 1); }
    25% { transform: scale(1.06, .92) translateY(6px); }
    55% { transform: scale(.96, 1.05) translateY(-12px); }
    100% { transform: scale(1, 1); }
  }
  .kitty.tilt .head { animation: tilt 1.1s ease-in-out; }
  @keyframes tilt { 0%, 100% { transform: rotate(0); } 40%, 60% { transform: rotate(-9deg); } }
  .head { transform-origin: 100px 150px; }
  .ear-l { transform-origin: 62px 60px; animation: twitch 5s ease-in-out infinite 2s; }
  .ear-r { transform-origin: 138px 60px; animation: twitch 6.5s ease-in-out infinite 3.3s; }
  @keyframes twitch { 0%, 92%, 100% { transform: rotate(0); } 94% { transform: rotate(-10deg); } 96% { transform: rotate(4deg); } }
  .eyes-open { transform-origin: 100px 104px; animation: blink 4.2s infinite 1s; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .eyes-happy { display: none; }
  .kitty.happy .eyes-open { display: none; }
  .kitty.happy .eyes-happy { display: inline; }

  .hb-front {
    position: absolute; left: 0; right: 0; top: 72px; bottom: 0; z-index: 4;
    border-radius: 6px 6px 14px 14px;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255, 255, 255, .12), transparent 60%),
      linear-gradient(180deg, #e8474b, var(--red) 40%, var(--red-deep));
    box-shadow: inset 0 0 0 2px rgba(244, 194, 91, .55), inset 0 0 0 8px var(--red), inset 0 0 0 9.5px rgba(244, 194, 91, .7);
  }
  .seal {
    position: absolute; left: 50%; top: 92px; width: 86px; height: 86px; margin-left: -43px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff1c4, var(--gold) 55%, var(--gold-deep));
    box-shadow: 0 3px 0 #9c6a1c, inset 0 0 0 3px rgba(255, 255, 255, .35);
    color: var(--red-deep); font: 52px/86px var(--brush); text-align: center;
  }
  .cloud-gold { position: absolute; width: 54px; opacity: .8; }
  .cloud-gold.a { left: 14px; bottom: 16px; }
  .cloud-gold.b { right: 14px; bottom: 16px; transform: scaleX(-1); }

  .paws {
    position: absolute; left: 5px; top: 58px; width: 200px; height: 34px; z-index: 5;
    opacity: 0; transform: translateY(14px);
    transition: opacity .2s ease, transform .3s ease;
  }
  .hb.open .paws { opacity: 1; transform: none; transition: opacity .25s ease .75s, transform .5s cubic-bezier(.3, 1.6, .5, 1) .75s; }

  .hb-flap {
    position: absolute; left: 0; top: 0; width: 210px; height: 122px; z-index: 6;
    border-radius: 14px 14px 50% 50% / 14px 14px 62% 62%;
    background: linear-gradient(180deg, #c42c34, #e0444a);
    border-bottom: 2.5px solid var(--gold);
    box-shadow: 0 6px 10px -4px rgba(80, 0, 0, .45);
    transform-origin: 50% 0;
    transition: transform .6s cubic-bezier(.5, 0, .3, 1) .45s, z-index 0s .75s;
  }
  .hb.open .hb-flap { transform: rotateX(180deg); z-index: 2; transition: transform .6s cubic-bezier(.5, 0, .3, 1), z-index 0s .22s; }
  .clasp {
    position: absolute; left: 50%; bottom: -19px; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff1c4, var(--gold) 55%, var(--gold-deep));
    box-shadow: 0 2px 0 #9c6a1c;
    color: var(--red); font: 20px/38px var(--hand); text-align: center;
    transition: opacity .2s ease;
  }
  .hb.open .clasp { opacity: 0; }

  .meow {
    position: absolute; left: 150px; top: 20px; z-index: 8;
    padding: 4px 12px 3px; border-radius: 14px; background: #fff; color: var(--red);
    font: 20px/1 var(--cute); white-space: nowrap;
    opacity: 0; transform: translateY(6px) scale(.8);
    transition: opacity .3s ease, transform .4s cubic-bezier(.3, 1.6, .5, 1);
  }
  .meow.show { opacity: 1; transform: none; }

  .hint {
    position: absolute; left: 0; right: 0; top: 656px; text-align: center;
    font: 700 24px/1 var(--hand); color: var(--gold-soft); letter-spacing: 1px;
    animation: pulse 1.8s ease-in-out infinite;
    transition: opacity .4s ease;
  }
  .hint small { display: block; margin-top: 4px; font: 16px/1 var(--cute); color: rgba(255, 230, 168, .7); }
  @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
  .is-open .hint { opacity: 0; animation: none; }
  .next-hint {
    position: absolute; left: 0; right: 0; top: 664px; text-align: center;
    font: 700 20px/1 var(--hand); color: rgba(255, 230, 168, .75);
    opacity: 0; transition: opacity .5s ease;
  }
  .can-next .next-hint { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .hb.closed, .tail, .ear-l, .ear-r, .eyes-open, .hint, .sky-lantern,
    .hb.open .kitty .body-bob, .kitty.hop .body-bob, .kitty.tilt .head { animation: none !important; }
    .sky-lantern { display: none; }
    .zh .ch { animation-duration: .01s; animation-delay: 0s !important; }
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="moon" aria-hidden="true"></div>
<svg class="branch" viewBox="0 0 190 120" aria-hidden="true">
  <path d="M0 22C40 30 70 44 96 70M48 36c10-14 26-20 40-20M96 70c16 8 34 12 54 8M120 76c6 12 8 24 6 38" stroke="#2a1420" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="#ff9fb4" stroke="#fff" stroke-width="1">
    <g transform="translate(88 16)"><circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/><circle r="2.5" fill="#f4c25b" stroke="none"/></g>
    <g transform="translate(96 70) scale(.9)"><circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/><circle r="2.5" fill="#f4c25b" stroke="none"/></g>
    <g transform="translate(150 78) scale(.8)"><circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/><circle r="2.5" fill="#f4c25b" stroke="none"/></g>
    <g transform="translate(126 112) scale(.7)"><circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/><circle r="2.5" fill="#f4c25b" stroke="none"/></g>
    <g transform="translate(40 32) scale(.7)"><circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/><circle r="2.5" fill="#f4c25b" stroke="none"/></g>
  </g>
  <circle cx="64" cy="44" r="4" fill="#ffc6d2"/><circle cx="140" cy="88" r="3.5" fill="#ffc6d2"/>
</svg>
<div id="lanterns" aria-hidden="true"></div>

<main class="scene" id="scene">
  <section class="note" id="note" aria-live="polite">
    <p class="zh" id="zh" lang="zh"></p>
    <p class="en" id="en"></p>
    <p class="src" id="src"></p>
    <div class="dots" id="dots"></div>
    <button class="again" id="again" type="button">↺ again</button>
    <div class="stamp" aria-hidden="true">喵</div>
  </section>

  <div class="hb closed" id="hb" role="button" tabindex="0" aria-label="Open the red envelope">
    <div class="hb-back"></div>

    <svg class="tail" viewBox="0 0 74 92" aria-hidden="true">
      <path d="M8 84C38 82 30 44 48 32 60 24 66 12 56 6" stroke="var(--cat-line)" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M8 84C38 82 30 44 48 32 60 24 66 12 56 6" stroke="var(--cat)" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M38 52l10 4M44 38l10 6" stroke="var(--cat-orange)" stroke-width="5" stroke-linecap="round"/>
    </svg>

    <div class="kitty" id="kitty">
      <svg viewBox="0 0 200 210" aria-hidden="true">
        <g class="body-bob">
          <ellipse cx="100" cy="196" rx="64" ry="52" fill="var(--cat)" stroke="var(--cat-line)" stroke-width="3"/>
          <g class="head">
            <g class="ear-l">
              <path d="M40 80L44 18Q62 28 84 50Z" fill="var(--cat-orange)" stroke="var(--cat-line)" stroke-width="3" stroke-linejoin="round"/>
              <path d="M50 66L52 34Q63 42 73 52Z" fill="#ffb8c6"/>
            </g>
            <g class="ear-r">
              <path d="M160 80L156 18Q138 28 116 50Z" fill="var(--cat)" stroke="var(--cat-line)" stroke-width="3" stroke-linejoin="round"/>
              <path d="M150 66L148 34Q137 42 127 52Z" fill="#ffb8c6"/>
              <g transform="translate(150 34) scale(.7)" fill="#ff9fb4" stroke="#fff" stroke-width="1.2">
                <circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/><circle r="2.6" fill="#f4c25b" stroke="none"/>
              </g>
            </g>
            <ellipse cx="100" cy="102" rx="76" ry="60" fill="var(--cat)" stroke="var(--cat-line)" stroke-width="3"/>
            <path d="M44 72Q56 46 84 44Q78 60 66 66Q56 70 44 72Z" fill="var(--cat-orange)"/>
            <path d="M90 44Q100 40 110 44Q106 56 100 58Q94 56 90 44Z" fill="var(--cat-orange)" opacity=".85"/>
            <g class="eyes-open">
              <ellipse cx="72" cy="104" rx="9.5" ry="11.5" fill="var(--cat-line)"/>
              <ellipse cx="128" cy="104" rx="9.5" ry="11.5" fill="var(--cat-line)"/>
              <circle cx="75.5" cy="99.5" r="3.4" fill="#fff"/><circle cx="131.5" cy="99.5" r="3.4" fill="#fff"/>
              <circle cx="69" cy="108.5" r="1.6" fill="#fff"/><circle cx="125" cy="108.5" r="1.6" fill="#fff"/>
            </g>
            <g class="eyes-happy" fill="none" stroke="var(--cat-line)" stroke-width="4" stroke-linecap="round">
              <path d="M62 107Q72 94 82 107M118 107Q128 94 138 107"/>
            </g>
            <ellipse cx="52" cy="124" rx="12" ry="6.5" fill="#ffa3b5" opacity=".75"/>
            <ellipse cx="148" cy="124" rx="12" ry="6.5" fill="#ffa3b5" opacity=".75"/>
            <path d="M95 115h10l-5 5.5z" fill="#ff8aa0" stroke="#e86f86" stroke-width="1" stroke-linejoin="round"/>
            <path d="M89 124q5.5 7 11 0q5.5 7 11 0" stroke="var(--cat-line)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
            <path d="M38 112l-24-4M38 121l-25 2M162 112l24-4M162 121l25 2" stroke="var(--cat-line)" stroke-width="2" stroke-linecap="round" opacity=".55"/>
          </g>
          <path d="M50 156Q100 178 150 156" stroke="var(--red)" stroke-width="9" fill="none" stroke-linecap="round"/>
          <circle cx="100" cy="171" r="8.5" fill="var(--gold)" stroke="var(--gold-deep)" stroke-width="2"/>
          <path d="M93 171h14M100 174v4" stroke="var(--gold-deep)" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <div class="hb-front">
      <div class="seal">爱</div>
      <svg class="cloud-gold a" viewBox="0 0 60 30" aria-hidden="true"><path d="M6 24c-6 0-6-9 0-10 0-8 11-10 15-4 3-8 16-9 19 0 6-3 14 1 12 8 6 1 6 6 0 6z" fill="none" stroke="#f4c25b" stroke-width="2"/><path d="M22 20c0-5 7-5 7 0 0 3-4 3-4 0" fill="none" stroke="#f4c25b" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="cloud-gold b" viewBox="0 0 60 30" aria-hidden="true"><path d="M6 24c-6 0-6-9 0-10 0-8 11-10 15-4 3-8 16-9 19 0 6-3 14 1 12 8 6 1 6 6 0 6z" fill="none" stroke="#f4c25b" stroke-width="2"/><path d="M22 20c0-5 7-5 7 0 0 3-4 3-4 0" fill="none" stroke="#f4c25b" stroke-width="2" stroke-linecap="round"/></svg>
    </div>

    <svg class="paws" viewBox="0 0 200 34" aria-hidden="true">
      <g fill="var(--cat)" stroke="var(--cat-line)" stroke-width="3">
        <ellipse cx="62" cy="18" rx="21" ry="13"/><ellipse cx="138" cy="18" rx="21" ry="13"/>
      </g>
      <path d="M53 25v-6M62 26v-7M71 25v-6M129 25v-6M138 26v-7M147 25v-6" stroke="var(--cat-line)" stroke-width="2.2" stroke-linecap="round"/>
    </svg>

    <div class="hb-flap"><span class="clasp">♥</span></div>
    <div class="meow" id="meow">喵～</div>
  </div>

  <div class="hint" id="hint">tap ♡<small>打开红包</small></div>
  <div class="next-hint">tap for more ♡</div>
</main>

<canvas id="fx"></canvas>

<script>
(() => {
  'use strict';

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);
  const scene = $('#scene'), hb = $('#hb'), kitty = $('#kitty'), note = $('#note');
  const zhEl = $('#zh'), enEl = $('#en'), srcEl = $('#src'), dotsEl = $('#dots'), meow = $('#meow');

  // Classic lines of Chinese love poetry, and a couple of legends
  const LINES = [
    { zh: '一日不见，如三秋兮', en: 'One day without seeing you feels like three autumns.', src: 'Book of Songs · c. 600 BC' },
    { zh: '山有木兮木有枝，心悦君兮君不知', en: 'The hills have trees, the trees have branches; my heart delights in you, and you don’t even know.', src: 'Song of the Yue Boatman' },
    { zh: '身无彩凤双飞翼，心有灵犀一点通', en: 'I have no phoenix wings to fly to you, yet our hearts are joined by a single thread.', src: 'Li Shangyin · Tang dynasty' },
    { zh: '愿我如星君如月，夜夜流光相皎洁', en: 'Let me be the star and you the moon, shining for each other every night.', src: 'Fan Chengda · Song dynasty' },
    { zh: '海上生明月，天涯共此时', en: 'The moon rises over the sea; however far apart, we share this very moment.', src: 'Zhang Jiuling · Tang dynasty' },
    { zh: '月老的红线，一头系着我，一头系着你', en: 'The Old Man under the Moon tied a red thread: one end to me, one end to you.', src: 'Legend of Yue Lao' },
    { zh: '金风玉露一相逢，便胜却人间无数', en: 'When golden wind meets jade dew, that one meeting outshines all others in the world.', src: 'Qin Guan · on the Qixi lovers' },
    { zh: '两情若是久长时，又岂在朝朝暮暮', en: 'If our love is meant to last forever, what are a few mornings and evenings apart?', src: 'Qin Guan · Song dynasty' },
    { zh: '春风十里，不如你', en: 'Ten miles of spring breeze can’t compare to you.', src: 'Feng Tang' },
    { zh: '执子之手，与子偕老', en: 'To hold your hand, and grow old together with you.', src: 'Book of Songs' },
    { zh: '愿得一心人，白首不相离', en: 'I wish for one true heart, and never to part until our hair turns white.', src: 'Zhuo Wenjun · Han dynasty' },
    { zh: '喵～ 有人很爱很爱你', en: 'Meow~ someone loves you very, very much.', src: '♥ the kitten', end: true },
  ];

  let state = 'closed', idx = -1, typingUntil = 0, typeTimer = 0;

  // ---------- fit the 380x700 scene to any screen ----------
  function fit() {
    const s = Math.min(1, (innerHeight - 16) / 700, (innerWidth - 12) / 380);
    scene.style.setProperty('--fit', s.toFixed(3));
    resizeCanvas();
  }

  // ---------- progress dots ----------
  LINES.forEach(() => dotsEl.appendChild(document.createElement('i')));
  const dots = [...dotsEl.children];

  // ---------- open / close ----------
  function open() {
    state = 'opening';
    hb.classList.remove('closed');
    hb.classList.add('open');
    hb.setAttribute('aria-label', 'Red envelope, open');
    document.body.classList.add('is-open');
    meow.classList.remove('show');
    setTimeout(() => {
      const r = hb.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * 0.15, 46);
      kitty.classList.add('happy');
    }, 650);
    setTimeout(() => {
      document.body.classList.add('show-note');
      state = 'reading';
      next();
    }, 1250);
  }

  function close() {
    state = 'closing';
    document.body.classList.remove('show-note', 'can-next', 'is-open');
    note.classList.remove('the-end');
    kitty.classList.remove('happy');
    hb.classList.remove('open');
    setTimeout(() => {
      hb.classList.add('closed');
      hb.setAttribute('aria-label', 'Open the red envelope');
      idx = -1; state = 'closed';
    }, 1100);
  }

  // ---------- one line at a time ----------
  function next() {
    if (idx >= LINES.length - 1) return;
    idx++;
    const line = LINES[idx];
    note.classList.remove('done', 'instant', 'the-end');
    document.body.classList.remove('can-next');
    zhEl.textContent = '';
    enEl.textContent = line.en;
    srcEl.textContent = '— ' + line.src;

    const step = reduced ? 0 : 85;
    let k = 0;
    for (const part of line.zh.split(/(?<=，)/)) {
      const run = document.createElement('span');
      run.style.whiteSpace = 'nowrap';
      for (const c of part) {
        const s = document.createElement('span');
        s.className = 'ch';
        s.textContent = c === ' ' ? ' ' : c;
        s.style.animationDelay = (k++ * step) + 'ms';
        run.appendChild(s);
      }
      zhEl.appendChild(run);
      zhEl.appendChild(document.createTextNode(' '));
    }
    typingUntil = performance.now() + k * step + 450;
    clearTimeout(typeTimer);
    typeTimer = setTimeout(finishTyping, k * step + 450);

    dots.forEach((d, i) => d.classList.toggle('on', i === idx));
    react(line);
  }

  function finishTyping() {
    clearTimeout(typeTimer);
    typingUntil = 0;
    note.classList.add('instant', 'done');
    if (LINES[idx].end) note.classList.add('the-end');
    else document.body.classList.add('can-next');
  }

  // the kitten reacts to every line: a hop, a head tilt, happy eyes, hearts
  function react(line) {
    const moves = ['hop', 'tilt'];
    const m = moves[idx % moves.length];
    kitty.classList.remove('hop', 'tilt');
    void kitty.offsetWidth; // restart the CSS animation
    kitty.classList.add(m);
    kitty.classList.toggle('happy', idx % 3 !== 1 || !!line.end);
    const r = kitty.getBoundingClientRect();
    hearts(r.left + r.width / 2, r.top + r.height * 0.25, line.end ? 40 : 10);
  }

  function onTap(e) {
    if (e.target.closest('#again')) return;
    if (state === 'closed') open();
    else if (state === 'reading') {
      if (typingUntil) finishTyping();
      else if (!LINES[idx].end) next();
    }
  }
  addEventListener('click', onTap);
  hb.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(e); }
  });
  $('#again').addEventListener('click', (e) => { e.stopPropagation(); close(); });

  // the closed envelope says meow now and then
  setInterval(() => {
    if (state !== 'closed' || reduced) return;
    meow.classList.add('show');
    setTimeout(() => meow.classList.remove('show'), 1300);
  }, 4200);

  // ---------- floating sky lanterns ----------
  if (!reduced) {
    const box = $('#lanterns');
    for (let i = 0; i < 9; i++) {
      const l = document.createElement('div');
      l.className = 'sky-lantern';
      const dur = 22 + Math.random() * 16;
      l.style.left = (4 + Math.random() * 92) + '%';
      l.style.animationDuration = dur + 's';
      l.style.animationDelay = (-Math.random() * dur) + 's';
      l.style.setProperty('--s', (0.5 + Math.random() * 0.7).toFixed(2));
      l.style.setProperty('--sway', ((Math.random() - 0.5) * 60).toFixed(0) + 'px');
      box.appendChild(l);
    }
  }

  // ---------- stars (sky canvas) and hearts (fx canvas) ----------
  const sky = $('#sky'), sctx = sky.getContext('2d');
  const fx = $('#fx'), ctx = fx.getContext('2d');
  let W = 0, H = 0, dpr = 1, stars = [];
  const parts = [];
  const heartColors = ['#ff6f86', '#ff9fb4', '#f4c25b', '#ffd1dc', '#e5484d'];

  function resizeCanvas() {
    W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
    for (const c of [sky, fx]) { c.width = W * dpr; c.height = H * dpr; }
    stars = Array.from({ length: Math.round(W * H / 6000) }, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.7, r: Math.random() * 1.3 + 0.3,
      ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.6,
    }));
  }

  function heart(x, y, vx, vy, size, life) {
    return { x, y, vx, vy, size, life, age: 0, rot: (Math.random() - .5) * .6, vr: (Math.random() - .5) * 2.4,
      color: heartColors[(Math.random() * heartColors.length) | 0] };
  }
  function burst(x, y, n) {
    if (reduced) return;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.4, sp = 160 + Math.random() * 380;
      parts.push(heart(x, y, Math.cos(a) * sp, Math.sin(a) * sp, 6 + Math.random() * 9, 2 + Math.random() * 1.2));
    }
  }
  function hearts(x, y, n) {
    if (reduced) return;
    for (let i = 0; i < n; i++) {
      parts.push(heart(x + (Math.random() - .5) * 80, y, (Math.random() - .5) * 40, -60 - Math.random() * 70,
        5 + Math.random() * 7, 2.2 + Math.random() * 1.5));
    }
  }

  function drawHeart(p, alpha) {
    const s = p.size;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(0, s * .9);
    ctx.bezierCurveTo(-s * 1.4, 0, -s * .6, -s * 1.15, 0, -s * .35);
    ctx.bezierCurveTo(s * .6, -s * 1.15, s * 1.4, 0, 0, s * .9);
    ctx.fill();
    ctx.restore();
  }

  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now; t += dt;

    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.clearRect(0, 0, W, H);
    sctx.fillStyle = '#fff6e0';
    for (const s of stars) {
      sctx.globalAlpha = reduced ? 0.7 : 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); sctx.fill();
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.age += dt;
      if (p.vy > -80) p.vy += 140 * dt;           // bursts fall softly, floaters keep rising
      p.vx *= Math.exp(-1.4 * dt);
      p.x += (p.vx + Math.sin(p.age * 3 + p.rot * 10) * 14) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      const a = Math.min(1, p.age * 6) * Math.max(0, 1 - Math.max(0, p.age - p.life * .55) / (p.life * .45));
      if (p.age > p.life) { parts.splice(i, 1); continue; }
      drawHeart(p, a);
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
